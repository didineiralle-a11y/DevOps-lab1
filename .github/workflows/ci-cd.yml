name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  IMAGE_NAME: ghcr.io/didineiralle-a11y/devops-lab1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t ${{ env.IMAGE_NAME }}:${{ github.sha }} .

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for testing
        run: docker build -t web-app-test .

      - name: Run container
        run: docker run -d --name web-app -p 5000:5000 web-app-test

      - name: Wait for container to become ready
        run: sleep 5

      - name: Check health-check endpoint
        run: curl -f http://localhost:5000/health

      - name: Stop and remove container
        if: always()
        run: docker rm -f web-app
